backend:
  name: git-gateway
  branch: main

media_folder: public/img
public_folder: /img

collections:
  - name: 'guide'          # 集合名称
    label: '指南'           # 后台显示名称
    folder: 'guide'        # 文件存放路径
    create: true           # 允许创建新文档
    slug: '{{slug}}'       # 文件名格式
    fields:                # 字段定义，这里开始丰富起来
      - { label: '标题', name: 'title', widget: 'string' }
      - { label: '发布日期', name: 'date', widget: 'datetime' } # 日期时间选择器
      - { label: '特色图片', name: 'thumbnail', widget: 'image' } # 图片上传
      - { label: '标签', name: 'tags', widget: 'list', default: ['教程'] } # 标签列表
      - { label: '文章状态', name: 'status', widget: 'select', options: ['草稿', '已发布'] } # 下拉选择
      - { label: '正文', name: 'body', widget: 'markdown' } # 正文