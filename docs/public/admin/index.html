<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <link rel="stylesheet" href="/admin/custom.css">
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.1.11/dist/decap-cms.js"></script>
    <script>
      // 为 'guide' 集合创建一个预览模板
      var GuidePreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var title = entry.getIn(['data', 'title']);
          var body = this.props.widgetFor('body');
          // 这里可以添加更复杂的HTML结构和样式
          return h('div', {},
            h('h1', {}, title),
            h('div', {className: "content"}, body)
          );
        }
      });
    
      // 注册这个预览模板，注意 'guide' 必须和 config.yml 中的集合名一致
      CMS.registerPreviewTemplate("guide", GuidePreview);
    </script>
  </body>
</html>
